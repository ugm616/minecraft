<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoppyField</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Enter Password</h1>

        <div class="input-wrapper">
            <input type="password" id="passwordInput" placeholder="Password..." autocomplete="off" />
        </div>

        <button class="mc-button" id="enterBtn" onclick="checkPassword()">
            <span>Enter</span>
        </button>

        <p id="errorMsg" class="error-msg">Incorrect password. Please try again.</p>
    </div>

    <script>
        const PASSWORD_INDEX = 1;

        let validPassword = null;

        fetch('passwords.json')
            .then(r => r.json())
            .then(data => { validPassword = data.keys[PASSWORD_INDEX]; })
            .catch(() => { validPassword = null; });

        function checkPassword() {
            if (validPassword === null) {
                return;
            }
            const input = document.getElementById('passwordInput').value;

            if (input === validPassword) {
                // Grant access token for this session then redirect
                sessionStorage.setItem('auth', 'granted');
                window.location.href = 'first.html';
            } else {
                const errorMsg = document.getElementById('errorMsg');
                const inputEl  = document.getElementById('passwordInput');

                errorMsg.classList.add('visible');
                inputEl.classList.add('shake');

                inputEl.addEventListener('animationend', () => {
                    inputEl.classList.remove('shake');
                }, { once: true });
            }
        }

        document.getElementById('passwordInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') checkPassword();
        });

        document.getElementById('passwordInput').addEventListener('input', function () {
            document.getElementById('errorMsg').classList.remove('visible');
        });
    </script>

</body>
</html>
