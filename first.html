<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>There was 3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="black-page">

    <div class="container">
        <p class="hidden-text" id="glitchText" style="color: black;"></p>
        <div class="image-wrapper">
            <img src="images/image.png" alt="Main Image" />
        </div>
    </div>

    <script>
        // ── Minecraft-style letter scramble glitch ──────────────
        // Full text: "The prIncess in the tower the rot in hour"
        // Glitched positions (always scrambling):
        //   index 1  → h  (T[h]e)
        //   index 2  → e  (Th[e])
        //   index 10 → s  (prInce[s]s)
        //   index 17 → h  (t[h]e)
        //   index 18 → e  (th[e])
        //   index 24 → r  (towe[r])
        //   index 28 → e  (th[e])
        const text = "The prIncess in the tower the rot in hour";
        const glitchIndices = new Set([1, 2, 10, 17, 18, 24, 28]);

        // Characters used for scrambling (Minecraft-style: letters + symbols)
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*<>?/\\|[]{}~';

        function randomChar() {
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function scrambleText() {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                if (text[i] === ' ') {
                    result += ' ';
                } else if (glitchIndices.has(i)) {
                    // Always scramble these specific positions
                    result += randomChar();
                } else {
                    result += text[i];
                }
            }
            document.getElementById('glitchText').textContent = result;
        }

        // Run scramble ~15 times per second for a readable but glitchy feel
        setInterval(scrambleText, 66);
    </script>

</body>
</html>
