<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>There was 3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="black-page">

    <div class="container">
        <p class="hidden-text">Replace Text Here</p>
        <div class="image-wrapper">
            <img src="images/image.png" alt="Main Image" />
        </div>
        <span class="glitch glitch-scramble" id="glitchText" data-text="Replace Text Here">CAN YOU READ ME?</span>
    </div>

    <script>
        // ── Minecraft-style letter scramble glitch ──────────────
        const glitchEl = document.getElementById('glitchText');
        const originalText = glitchEl.getAttribute('data-text');

        // Characters used for scrambling (Minecraft-style: letters + symbols)
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*<>?/\\|[]{}~';

        function randomChar() {
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function scrambleText() {
            // Each character has an independent chance of being scrambled each frame
            let result = '';
            for (let i = 0; i < originalText.length; i++) {
                if (originalText[i] === ' ') {
                    result += ' ';
                } else if (Math.random() < 0.75) {
                    // 25% chance this character glitches this frame
                    result += randomChar();
                } else {
                    result += originalText[i];
                }
            }
            glitchEl.textContent = result;
            // Keep data-text in sync so CSS pseudo-elements also glitch
            glitchEl.setAttribute('data-text', result);
        }

        // Run scramble ~15 times per second for a readable but glitchy feel
        setInterval(scrambleText, 66);
    </script>

</body>
</html>
