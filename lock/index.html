<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lock Screen</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Lock-screen specific additions ── */
    body {
      flex-direction: column;
      gap: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #status {
      font-family: "Mojang", monospace;
      font-size: 0.9rem;
      height: 1.6rem;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 1px 1px 0 #3f3f3f;
    }

    #status.success { color: #55ff55; }
    #status.error   { color: #ff5555; text-shadow: 1px 1px 0 #7a0000; }

    #lock-wrapper {
      position: relative;
      width: min(72vw, 72vh, 288px);
      height: min(72vw, 72vh, 288px);
      margin-bottom: 20px;
    }

    #line-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      image-rendering: pixelated;
    }

    #dot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 100%;
      height: 100%;
    }

    .dot-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Minecraft-style square dots */
    .dot {
      width: clamp(16px, 4.5vw, 20px);
      height: clamp(16px, 4.5vw, 20px);
      background-color: #555555;
      box-shadow:
        inset 1px 1px 0 #888888,
        inset -1px -1px 0 #333333;
      transition: background-color 0.1s, transform 0.1s;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .dot.active {
      background-color: #aaaaff;
      box-shadow:
        inset 1px 1px 0 #ddddff,
        inset -1px -1px 0 #4444aa;
      transform: scale(1.35);
    }

    .dot.success {
      background-color: #55ff55;
      box-shadow:
        inset 1px 1px 0 #aaffaa,
        inset -1px -1px 0 #007700;
      transform: scale(1.35);
    }

    .dot.error {
      background-color: #ff5555;
      box-shadow:
        inset 1px 1px 0 #ffaaaa,
        inset -1px -1px 0 #770000;
      transform: scale(1.35);
    }

    #hint {
      font-family: "Mojang", monospace;
      font-size: 0.75rem;
      color: #666666;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>&#128274; Enter Pattern</h1>
    <div id="status"></div>

    <div id="lock-wrapper">
      <canvas id="line-canvas"></canvas>
      <div id="dot-grid"></div>
    </div>

    <p id="hint">Draw the unlock pattern</p>
  </div>

  <script>
    // -- State --
    let correctPattern = [];
    let redirectUrl    = '';
    let userPattern    = [];
    let isDrawing      = false;
    let currentMouse   = { x: 0, y: 0 };
    let dots           = [];
    let canvasSize     = 288;
    let locked         = false;

    const canvas   = document.getElementById('line-canvas');
    const ctx      = canvas.getContext('2d');
    const gridEl   = document.getElementById('dot-grid');
    const wrapper  = document.getElementById('lock-wrapper');
    const statusEl = document.getElementById('status');

    // -- Load config --
    fetch('pattern.json')
      .then(r => r.json())
      .then(cfg => {
        redirectUrl    = cfg.redirect || '/';
        correctPattern = parsePattern(cfg.grid);
        buildGrid();
        resizeCanvas();
      })
      .catch(() => {
        statusEl.className = 'error';
        statusEl.textContent = 'Failed to load pattern.json';
      });

    function parsePattern(grid) {
      const pts = [];
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[r].length; c++) {
          const v = grid[r][c];
          if (v > 0) pts.push({ order: v, key: `${r},${c}` });
        }
      }
      pts.sort((a, b) => a.order - b.order);
      return pts.map(p => p.key);
    }

    // -- Grid setup --
    function buildGrid() {
      gridEl.innerHTML = '';
      dots = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const cell = document.createElement('div');
          cell.className = 'dot-cell';
          const dot = document.createElement('div');
          dot.className = 'dot';
          cell.appendChild(dot);
          gridEl.appendChild(cell);
          dots.push({ row: r, col: c, el: dot });
        }
      }
    }

    // -- Canvas sizing --
    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      canvasSize = rect.width;
      canvas.width  = canvasSize;
      canvas.height = canvasSize;
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    // -- Geometry helpers --
    function dotCenter(row, col) {
      const cell = canvasSize / 3;
      return { x: col * cell + cell / 2, y: row * cell + cell / 2 };
    }

    function hitTest(x, y) {
      const cell = canvasSize / 3;
      // Hit radius matches the visual dot size (~10px at 288px grid),
      // so a dot only activates when the pointer is directly over it.
      const hitRadius = cell * 0.14;
      for (const d of dots) {
        const c = dotCenter(d.row, d.col);
        if (Math.hypot(x - c.x, y - c.y) < hitRadius) return `${d.row},${d.col}`;
      }
      return null;
    }

    function localPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src  = e.touches ? e.touches[0] : e;
      return {
        x: (src.clientX - rect.left) * (canvasSize / rect.width),
        y: (src.clientY - rect.top)  * (canvasSize / rect.height)
      };
    }

    // -- Drawing -- pixelated/sharp lines to match MC aesthetic
    function redraw(mode) {
      ctx.clearRect(0, 0, canvasSize, canvasSize);
      if (userPattern.length < 1) return;

      let lineColor;
      if      (mode === 'success') lineColor = 'rgba(85, 255, 85, 0.85)';
      else if (mode === 'error')   lineColor = 'rgba(255, 85, 85, 0.85)';
      else                         lineColor = 'rgba(170, 170, 255, 0.85)';

      ctx.save();
      ctx.strokeStyle = lineColor;
      ctx.lineWidth   = 3;
      ctx.lineCap     = 'square';
      ctx.lineJoin    = 'miter';
      tracePath();
      ctx.restore();
    }

    function tracePath() {
      ctx.beginPath();
      const [r0, c0] = userPattern[0].split(',').map(Number);
      const start = dotCenter(r0, c0);
      ctx.moveTo(start.x, start.y);
      for (let i = 1; i < userPattern.length; i++) {
        const [r, c] = userPattern[i].split(',').map(Number);
        const p = dotCenter(r, c);
        ctx.lineTo(p.x, p.y);
      }
      if (isDrawing) ctx.lineTo(currentMouse.x, currentMouse.y);
      ctx.stroke();
    }

    // -- Pattern interaction --
    function activateDot(key) {
      if (userPattern.includes(key)) return;
      userPattern.push(key);
      const [r, c] = key.split(',').map(Number);
      const d = dots.find(x => x.row === r && x.col === c);
      if (d) d.el.classList.add('active');
    }

    function onStart(e) {
      if (locked) return;
      e.preventDefault();
      const pos = localPos(e);
      const key = hitTest(pos.x, pos.y);
      if (!key) return;
      isDrawing    = true;
      userPattern  = [];
      currentMouse = pos;
      dots.forEach(d => d.el.className = 'dot');
      ctx.clearRect(0, 0, canvasSize, canvasSize);
      statusEl.textContent = '';
      statusEl.className   = '';
      activateDot(key);
      redraw();
    }

    function onMove(e) {
      if (!isDrawing || locked) return;
      e.preventDefault();
      const pos = localPos(e);
      currentMouse = pos;
      const key = hitTest(pos.x, pos.y);
      if (key) activateDot(key);
      redraw();
    }

    function onEnd(e) {
      if (!isDrawing || locked) return;
      isDrawing = false;
      evaluate();
    }

    function evaluate() {
      if (userPattern.length === 0) return;
      const correct = JSON.stringify(userPattern) === JSON.stringify(correctPattern);
      if (correct) {
        locked = true;
        statusEl.className   = 'success';
        statusEl.textContent = '\u2713 Unlocked!';
        dots.forEach(d => {
          if (d.el.classList.contains('active')) {
            d.el.classList.remove('active');
            d.el.classList.add('success');
          }
        });
        redraw('success');
        setTimeout(() => { window.location.href = redirectUrl; }, 600);
      } else {
        statusEl.className   = 'error';
        statusEl.textContent = '\u2717 Wrong pattern';
        dots.forEach(d => {
          if (d.el.classList.contains('active')) {
            d.el.classList.remove('active');
            d.el.classList.add('error');
          }
        });
        redraw('error');
        const c = document.querySelector('.container');
        c.classList.add('shake');
        c.addEventListener('animationend', () => c.classList.remove('shake'), { once: true });
        setTimeout(reset, 1000);
      }
    }

    function reset() {
      userPattern  = [];
      isDrawing    = false;
      locked       = false;
      statusEl.textContent = '';
      statusEl.className   = '';
      dots.forEach(d => { d.el.className = 'dot'; });
      ctx.clearRect(0, 0, canvasSize, canvasSize);
    }

    // -- Event listeners --
    wrapper.addEventListener('mousedown',   onStart);
    wrapper.addEventListener('mousemove',   onMove);
    wrapper.addEventListener('mouseup',     onEnd);
    wrapper.addEventListener('mouseleave',  onEnd);

    wrapper.addEventListener('touchstart',  onStart, { passive: false });
    wrapper.addEventListener('touchmove',   onMove,  { passive: false });
    wrapper.addEventListener('touchend',    onEnd);
    wrapper.addEventListener('touchcancel', onEnd);
  </script>
</body>
</html>
