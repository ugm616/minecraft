<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lock Screen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    h1 {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
      opacity: 0.75;
    }

    #status {
      height: 1.8rem;
      font-size: clamp(0.85rem, 3vw, 1rem);
      margin-bottom: 1.2rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    #lock-wrapper {
      position: relative;
      width: min(80vw, 80vh, 320px);
      height: min(80vw, 80vh, 320px);
    }

    #line-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #dot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 100%;
      height: 100%;
    }

    .dot-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dot {
      width: clamp(18px, 5vw, 22px);
      height: clamp(18px, 5vw, 22px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.45);
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      pointer-events: none;
    }

    .dot.active {
      background: #4fc3f7;
      border-color: #81d4fa;
      transform: scale(1.4);
      box-shadow: 0 0 10px rgba(79, 195, 247, 0.6);
    }

    .dot.success {
      background: #66bb6a;
      border-color: #a5d6a7;
      transform: scale(1.4);
      box-shadow: 0 0 10px rgba(102, 187, 106, 0.6);
    }

    .dot.error {
      background: #ef5350;
      border-color: #ef9a9a;
      transform: scale(1.4);
      box-shadow: 0 0 10px rgba(239, 83, 80, 0.6);
    }

    #hint {
      margin-top: 1.5rem;
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      opacity: 0.35;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <h1>&#128274; Enter Pattern</h1>
  <div id="status"></div>

  <div id="lock-wrapper">
    <canvas id="line-canvas"></canvas>
    <div id="dot-grid"></div>
  </div>

  <p id="hint">Draw the unlock pattern</p>

  <script>
    // -- State --
    let correctPattern = [];
    let redirectUrl    = '';
    let userPattern    = [];
    let isDrawing      = false;
    let currentMouse   = { x: 0, y: 0 };
    let dots           = [];          // { row, col, el }
    let canvasSize     = 320;
    let locked         = false;

    const canvas   = document.getElementById('line-canvas');
    const ctx      = canvas.getContext('2d');
    const gridEl   = document.getElementById('dot-grid');
    const wrapper  = document.getElementById('lock-wrapper');
    const statusEl = document.getElementById('status');

    // -- Load config --
    fetch('pattern.json')
      .then(r => r.json())
      .then(cfg => {
        redirectUrl    = cfg.redirect || '/';
        correctPattern = parsePattern(cfg.grid);
        buildGrid();
        resizeCanvas();
      })
      .catch(() => {
        statusEl.style.color = '#ef5350';
        statusEl.textContent = 'Failed to load pattern.json';
      });

    function parsePattern(grid) {
      const pts = [];
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[r].length; c++) {
          const v = grid[r][c];
          if (v > 0) pts.push({ order: v, key: `${r},${c}` });
        }
      }
      pts.sort((a, b) => a.order - b.order);
      return pts.map(p => p.key);
    }

    // -- Grid setup --
    function buildGrid() {
      gridEl.innerHTML = '';
      dots = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const cell = document.createElement('div');
          cell.className = 'dot-cell';
          const dot = document.createElement('div');
          dot.className = 'dot';
          cell.appendChild(dot);
          gridEl.appendChild(cell);
          dots.push({ row: r, col: c, el: dot });
        }
      }
    }

    // -- Canvas sizing --
    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      canvasSize = rect.width;
      canvas.width  = canvasSize;
      canvas.height = canvasSize;
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    // -- Geometry helpers --
    function dotCenter(row, col) {
      const cell = canvasSize / 3;
      return { x: col * cell + cell / 2, y: row * cell + cell / 2 };
    }

    function hitTest(x, y) {
      const cell = canvasSize / 3;
      const hitRadius = cell * 0.42;
      for (const d of dots) {
        const c = dotCenter(d.row, d.col);
        const dist = Math.hypot(x - c.x, y - c.y);
        if (dist < hitRadius) return `${d.row},${d.col}`;
      }
      return null;
    }

    function localPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src  = e.touches ? e.touches[0] : e;
      return {
        x: (src.clientX - rect.left) * (canvasSize / rect.width),
        y: (src.clientY - rect.top)  * (canvasSize / rect.height)
      };
    }

    // -- Drawing --
    function redraw(mode) {
      ctx.clearRect(0, 0, canvasSize, canvasSize);
      if (userPattern.length < 1) return;

      let lineColor, glowColor;
      if (mode === 'success') {
        lineColor = 'rgba(102, 187, 106, 0.85)';
        glowColor = 'rgba(102, 187, 106, 0.35)';
      } else if (mode === 'error') {
        lineColor = 'rgba(239, 83, 80, 0.85)';
        glowColor = 'rgba(239, 83, 80, 0.35)';
      } else {
        lineColor = 'rgba(79, 195, 247, 0.8)';
        glowColor = 'rgba(79, 195, 247, 0.25)';
      }

      ctx.save();
      ctx.strokeStyle = glowColor;
      ctx.lineWidth   = 10;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      tracePath();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = lineColor;
      ctx.lineWidth   = 3;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      tracePath();
      ctx.restore();
    }

    function tracePath() {
      ctx.beginPath();
      const [r0, c0] = userPattern[0].split(',').map(Number);
      const start = dotCenter(r0, c0);
      ctx.moveTo(start.x, start.y);
      for (let i = 1; i < userPattern.length; i++) {
        const [r, c] = userPattern[i].split(',').map(Number);
        const p = dotCenter(r, c);
        ctx.lineTo(p.x, p.y);
      }
      if (isDrawing) ctx.lineTo(currentMouse.x, currentMouse.y);
      ctx.stroke();
    }

    // -- Pattern interaction --
    function activateDot(key) {
      if (userPattern.includes(key)) return;
      userPattern.push(key);
      const [r, c] = key.split(',').map(Number);
      const d = dots.find(x => x.row === r && x.col === c);
      if (d) d.el.classList.add('active');
    }

    function onStart(e) {
      if (locked) return;
      e.preventDefault();
      const pos = localPos(e);
      const key = hitTest(pos.x, pos.y);
      if (!key) return;
      isDrawing    = true;
      userPattern  = [];
      currentMouse = pos;
      dots.forEach(d => d.el.className = 'dot');
      ctx.clearRect(0, 0, canvasSize, canvasSize);
      statusEl.textContent = '';
      activateDot(key);
      redraw();
    }

    function onMove(e) {
      if (!isDrawing || locked) return;
      e.preventDefault();
      const pos = localPos(e);
      currentMouse = pos;
      const key = hitTest(pos.x, pos.y);
      if (key) activateDot(key);
      redraw();
    }

    function onEnd(e) {
      if (!isDrawing || locked) return;
      isDrawing = false;
      evaluate();
    }

    function evaluate() {
      if (userPattern.length === 0) return;
      const correct = JSON.stringify(userPattern) === JSON.stringify(correctPattern);
      if (correct) {
        locked = true;
        statusEl.style.color = '#66bb6a';
        statusEl.textContent = '\u2713 Unlocked!';
        dots.forEach(d => {
          if (d.el.classList.contains('active')) {
            d.el.classList.remove('active');
            d.el.classList.add('success');
          }
        });
        redraw('success');
        setTimeout(() => { window.location.href = redirectUrl; }, 600);
      } else {
        statusEl.style.color = '#ef5350';
        statusEl.textContent = '\u2717 Wrong pattern';
        dots.forEach(d => {
          if (d.el.classList.contains('active')) {
            d.el.classList.remove('active');
            d.el.classList.add('error');
          }
        });
        redraw('error');
        setTimeout(reset, 1000);
      }
    }

    function reset() {
      userPattern  = [];
      isDrawing    = false;
      locked       = false;
      statusEl.textContent = '';
      dots.forEach(d => { d.el.className = 'dot'; });
      ctx.clearRect(0, 0, canvasSize, canvasSize);
    }

    // -- Event listeners --
    wrapper.addEventListener('mousedown',   onStart);
    wrapper.addEventListener('mousemove',   onMove);
    wrapper.addEventListener('mouseup',     onEnd);
    wrapper.addEventListener('mouseleave',  onEnd);

    wrapper.addEventListener('touchstart',  onStart, { passive: false });
    wrapper.addEventListener('touchmove',   onMove,  { passive: false });
    wrapper.addEventListener('touchend',    onEnd);
    wrapper.addEventListener('touchcancel', onEnd);
  </script>
</body>
</html>
